# --- Connection Settings ---
listen_addresses = '*'          # Listen on all interfaces (0.0.0.0)
port = 5432
max_connections = 100

# --- Memory Settings (Defaults - Tune these later based on workload) ---
shared_buffers = 1GB
dynamic_shared_memory_type = posix

# Per-operation memory (sorts/hashes).
# 32MB is safe. If you have 100 connections, this could use 3GB,
# but locally you likely only have a few connections.
# work_mem = 32MB

# Tells the query planner how much RAM is likely available for file caching.
# (16GB RAM - 2GB Shared Buffers - 8GB for OS/Apps = ~6GB)
# effective_cache_size = 6GB

# --- WAL (Write Ahead Log) ---
wal_level = replica

# --- Logging ---
# We log to stderr so 'podman logs' or 'docker logs' can capture output
log_destination = 'stderr'
logging_collector = off         # Let the container runtime handle log collection
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'

# --- Locale ---
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# --- PGVECTOR OPTIMIZATIONS ---

# 1. Memory for Index Building
# Critical for fast HNSW index creation.
# Increase this temporarily for the session if you can't set it high globally.
maintenance_work_mem = 1GB

# 2. Parallel Build
# Allow index creation to use multiple cores.
max_parallel_maintenance_workers = 2
max_worker_processes = 4
max_parallel_workers = 4

# 3. Checkpoints
# Prevent aggressive checkpointing during heavy index writes.
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# 4. (Optional) Load vector early to enable global defaults for search params
# shared_preload_libraries = 'vector'
# hnsw.ef_search = 64

# --- Extension Loading ---
# Preload libraries if needed (e.g., 'pg_stat_statements')
shared_preload_libraries = 'pg_stat_statements'

pg_stat_statements.max = 10000        # Track up to 10k unique statements
pg_stat_statements.track = all        # Track nested queries (PL/pgSQL) too